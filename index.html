.subs .tile{border-right-width:1px;border-top:5px solid var(--c);text-align:center}
.subs .e{font-size:2rem;display:block;line-height:1.3}
.subs h2{font-size:1.15rem}
.pg{margin-top:12px}
.pg h1{font-size:2rem;margin-bottom:8px}
.pg h3{font-size:1.2rem;margin:18px 0 8px;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:12px 0}
.sec h3{font-size:1.25rem;margin-bottom:4px;color:var(--ink)}
.sec p,.sec li{margin:4px 0}
.sec ul{padding-right:20px;margin:4px 0}
.ex{font-family:"Amiri",serif;font-size:1.25rem}
.rule{border-right:6px solid var(--sun)}
.value{border-right:6px solid var(--t1)}
.q{padding:10px 0;border-top:1px solid var(--line)}
.q p{margin:0 0 6px;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:2px 14px;min-height:42px;font-family:"Amiri",serif;font-size:1.2rem;cursor:pointer}
.opts button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opts button.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.fb{margin:6px 0 0;font-size:.92rem;color:var(--muted)}
.score{font-weight:700;margin-top:8px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:0 10px;font-size:.8rem;color:var(--muted);white-space:nowrap}
.tag.on{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

var v=document.getElementById("v"),cr=document.getElementById("cr");
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function link(h,c,x){var a=el("a",c,x);a.href="#"+h;return a}
function find(arr,id){for(var i=0;i<arr.length;i++)if(arr[i][0]===id)return arr[i];return null}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function L(tid,sid){var r=[];P.forEach(function(p){if(p[0]===tid&&p[2][sid])p[2][sid].split("|").forEach(function(t){r.push({t:t,m:p[1]})})});return r}
function ready(a){return a.filter(function(x){return C[x.t]}).length}
function crumbs(parts){
  cr.textContent="";
  parts.forEach(function(p,i){
    if(i)cr.appendChild(document.createTextNode(" ‹ "));
    cr.appendChild(p.h?link(p.h,null,p.x):el("span",null,p.x));
  });
}
function home(){
  document.title="واحة المعرفة – السنة الخامسة ابتدائي";crumbs([]);v.textContent="";
  var h=el("div","hero");
  h.innerHTML='<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="72" cy="26" r="14" fill="#E9A820"/><path d="M0 84q25-14 50 0t50 0v16H0z" fill="#2B6CB0" opacity=".85"/><path d="M42 84q-2-30 6-52" stroke="#6B4A2B" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M48 32q-18-4-28 8M48 32q-6-16-24-14M48 32q8-16 26-12M48 32q18-2 26 12" stroke="#1F7A5C" stroke-width="5" fill="none" stroke-linecap="round"/></svg>';
  var tx=el("div");tx.appendChild(el("h1",null,"واحة المعرفة"));tx.appendChild(el("p",null,"دروس السنة الخامسة ابتدائي: شرح، أمثلة، قاعدة، ألعاب، وعبرة."));
  h.appendChild(tx);v.appendChild(h);
  var g=el("div","grid");
  TERMS.forEach(function(t){
    var n=0,r=0;SUBJ.forEach(function(s){var a=L(t[0],s[0]);n+=a.length;r+=ready(a)});
    var a=link(t[0],"tile");a.style.setProperty("--c",t[2]);
    a.appendChild(el("h2",null,t[1]));a.appendChild(el("span",null,n+" درسًا في المخطط – "+r+" جاهز"));g.appendChild(a);
  });
  v.appendChild(g);
}
function term(tid){
  var t=find(TERMS,tid);if(!t)return home();
  document.title=t[1]+" – واحة المعرفة";crumbs([{h:"home",x:"الرئيسية"},{x:t[1]}]);v.textContent="";
  var pg=el("div","pg");pg.appendChild(el("h1",null,t[1]));v.appendChild(pg);
  var g=el("div","grid subs");
  SUBJ.forEach(function(s){
    var n=L(tid,s[0]).length;
    var a=link(tid+"-"+s[0],"tile");a.style.setProperty("--c",t[2]);
    a.appendChild(el("span","e",s[2]));a.appendChild(el("h2",null,s[1]));
    a.appendChild(el("span",null,n?n+" درسًا":"لا دروس في المخطط"));g.appendChild(a);
  });
  pg.appendChild(g);
}
function subject(tid,sid){
  var t=find(TERMS,tid),s=find(SUBJ,sid);if(!t||!s)return home();
  document.title=s[1]+" – "+t[1];crumbs([{h:"home",x:"الرئيسية"},{h:tid,x:t[1]},{x:s[1]}]);v.textContent="";
  var pg=el("div","pg");pg.appendChild(el("h1",null,s[2]+" "+s[1]));v.appendChild(pg);
  var ls=L(tid,sid);
  if(!ls.length){pg.appendChild(el("div","empty","لا توجد دروس لهذه المادة في هذا الفصل حسب المخطط."));return}
  var g,last="";
  ls.forEach(function(l,i){
    if(l.m!==last){last=l.m;pg.appendChild(el("h3",null,l.m));g=el("div","grid");pg.appendChild(g)}
    var a=link(tid+"-"+sid+"-"+(i+1),"tile");a.style.setProperty("--c",t[2]);
    var r=el("div","li");r.appendChild(el("h2",null,l.t));
    r.appendChild(el("span",C[l.t]?"tag on":"tag",C[l.t]?"جاهز":"قريبًا"));
    a.appendChild(r);g.appendChild(a);
  });
}
function sec(cls,title){var d=el("section","sec "+cls);d.appendChild(el("h3",null,title));return d}
function lesson(tid,sid,k){
  var t=find(TERMS,tid),s=find(SUBJ,sid),ls=L(tid,sid),it=ls[k-1];
  if(!t||!s||!it)return home();
  var l=C[it.t];
  document.title=it.t+" – واحة المعرفة";
  crumbs([{h:"home",x:"الرئيسية"},{h:tid,x:t[1]},{h:tid+"-"+sid,x:s[1]},{x:it.t}]);
  v.textContent="";var pg=el("div","pg");pg.appendChild(el("h1",null,it.t));pg.appendChild(el("p",null,it.m));v.appendChild(pg);
  if(!l){pg.appendChild(el("div","empty","هذا الدرس مدرج في المخطط السنوي، وسيُضاف محتواه قريبًا: شرح، أمثلة، قاعدة، ألعاب، وعبرة."));return}

  var a=sec("","1) شرح بسيط");l.explain.forEach(function(x){a.appendChild(el("p",null,x))});pg.appendChild(a);
  var b=sec("","2) أمثلة"),ul=el("ul");l.examples.forEach(function(x){ul.appendChild(el("li","ex",x))});b.appendChild(ul);pg.appendChild(b);
  var c=sec("rule","3) القاعدة");c.appendChild(el("p",null,l.rule));pg.appendChild(c);

  var d=sec("","4) لنلعب ونتعلّم"),right=0,done=0,sc=el("p","score");
  l.game.forEach(function(q0){
    var q=el("div","q"),o=el("div","opts"),fb=el("p","fb");
    q.appendChild(el("p",null,q0[0]));
    var opts=q0[1].map(function(x,i){return{x:x,c:i===q0[2]}});shuffle(opts);
    opts.forEach(function(op){
      var bt=el("button",null,op.x);bt.type="button";
      bt.addEventListener("click",function(){
        if(q.dataset.d)return;q.dataset.d="1";done++;
        if(op.c){right++;bt.className="ok";fb.textContent="أحسنت! "+q0[3]}
        else{bt.className="bad";fb.textContent=q0[3];Array.prototype.forEach.call(o.children,function(x,j){if(opts[j].c)x.className="ok"})}
        if(done===l.game.length)sc.textContent="نتيجتك: "+right+" / "+l.game.length;
      });
      o.appendChild(bt);
    });
    q.appendChild(o);q.appendChild(fb);d.appendChild(q);
  });
  d.appendChild(sc);pg.appendChild(d);

  var e=sec("value","5) العبرة");e.appendChild(el("p",null,l.value));pg.appendChild(e);
}
function route(){
  var p=(location.hash||"#home").slice(1).split("-");
  if(p[0]==="home"||!p[0])home();
  else if(p.length===1)term(p[0]);
  else if(p.length===2)subject(p[0],p[1]);
  else lesson(p[0],p[1],parseInt(p[2],10));
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
</script>
